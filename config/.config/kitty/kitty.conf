allow_remote_control yes

confirm_os_window_close 1

# Fonts
font_family       Source Code Variable Semibold
bold_font         Source Code Variable Black
italic_font       Source Code Variable Italic
bold_italic_font  Source Code Variable Black Italic

font_size  12.0

# Window layout
remember_window_size   yes
window_padding_width   8.0

hide_window_decorations titlebar-only

# Tab bar
tab_bar_style  separator
tab_separator " | "
active_tab_font_style   bold-italic
inactive_tab_font_style normal

# OS specific
macos_option_as_alt no

# Keyboard shortcuts

# Window management
# Open a new pane in the same directory
map kitty_mod+enter new_window_with_cwd
map cmd+enter new_window_with_cwd

map ctrl+shift+k previous_window
map ctrl+shift+j next_window

# Window resizing
map ctrl+left resize_window narrower
map ctrl+right resize_window wider
map ctrl+up resize_window taller
map ctrl+down resize_window shorter

# Font sizes
map  cmd+0      change_font_size all 0
map  cmd+0x1E   change_font_size all +1.0
map  cmd+minus  change_font_size all -1.0

map kitty_mod+0 	change_font_size all 0
map kitty_mod+plus 	change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0

# Move by words
map  alt+left   send_text all \x1b\x62
map  alt+right  send_text all \x1b\x66

# Pane layout and focus
window_border_width 2
window_margin_width 0
draw_minimal_borders yes

inactive_text_alpha   0.65
