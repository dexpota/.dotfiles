- name: Install retained packages
  vars:
    common_packages:
      - sdcv
      - curl
      - cmus
      - parallel
      - vim
      - git
      - git-lfs
      - stow
      - ranger
      - highlight
      - neovim
      - cmake
      - jq
      - unzip
    platform_packages:
      Darwin:
        - python
        - task
      Ubuntu:
        - build-essential
        - python3-dev
        - python3-pip
        - inotify-tools
        - taskwarrior
      Archlinux:
        - base-devel
        - python
        - python-pip
        - inotify-tools
        - task
        - timew
        - cronie
  tags: packages
  block:
    - name: Install macOS packages with Homebrew
      community.general.homebrew:
        name: "{{ common_packages + platform_packages['Darwin'] }}"
        state: present
      when: ansible_facts['system'] == 'Darwin'

    - name: Install Linux packages with the native package manager
      ansible.builtin.package:
        name: "{{ common_packages + platform_packages[ansible_facts['distribution']] }}"
        state: present
      become: true
      when: ansible_facts['distribution'] in ['Ubuntu', 'Archlinux']
